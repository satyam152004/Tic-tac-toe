<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe — Complete Clean & Minimal UI Kit (53 Views)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #F8F8F6;
      --surface: #FFFFFF;
      --subtle: #F1F1EE;
      --border: #E4E4DF;
      --border-strong: #CFCFC8;
      --ink-primary: #141518;
      --ink-secondary: #5C606A;
      --ink-muted: #8E939E;
      --accent: #1D4ED8;
      --accent-pressed: #1E40AF;
      --accent-soft: #EFF4FF;
      --success: #15803D;
      --success-soft: #F0FDF4;
      --warning: #B45309;
      --warning-soft: #FFFBEB;
      --danger: #B91C1C;
      --danger-soft: #FEF2F2;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #EFEFED;
      color: var(--ink-primary);
      margin: 0;
      overflow-x: hidden;
    }

    .font-display {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 320x640 Mobile Device Frame */
    .device-shell {
      width: 336px;
      height: 656px;
      padding: 8px;
      border-radius: 44px;
      background: #1B1C20;
      box-shadow:
        0 18px 40px -14px rgba(20, 21, 24, 0.22),
        0 2px 6px rgba(20, 21, 24, 0.08),
        inset 0 0 0 1.5px rgba(255, 255, 255, 0.14);
      position: relative;
      flex-shrink: 0;
      transform-origin: top center;
    }

    .device-screen {
      width: 320px;
      height: 640px;
      border-radius: 36px;
      background-color: var(--canvas);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      color: var(--ink-primary);
    }

    /* Clean & Minimal Design System Primitives */
    .ui-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(20, 21, 24, 0.035);
    }

    .ui-group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(20, 21, 24, 0.03);
    }

    .ui-group-row {
      min-height: 38px;
      padding: 8px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface);
    }

    .ui-group-row + .ui-group-row {
      border-top: 1px solid var(--border);
    }

    .ui-btn-primary {
      height: 41px;
      border-radius: 10px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      width: 100%;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .ui-btn-primary:hover {
      background: var(--accent-pressed);
    }

    .ui-btn-secondary {
      height: 41px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--ink-primary);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      width: 100%;
      cursor: pointer;
    }

    .ui-btn-ghost {
      height: 34px;
      border-radius: 10px;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      width: 100%;
      cursor: pointer;
    }

    .ui-btn-danger {
      height: 41px;
      border-radius: 10px;
      background: var(--danger-soft);
      border: 1px solid #FECACA;
      color: var(--danger);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      width: 100%;
      cursor: pointer;
    }

    .ui-input {
      height: 37px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      padding: 0 11px;
      font-size: 12.5px;
      color: var(--ink-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ui-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 5px;
      padding-left: 2px;
    }

    .screen-card-wrap {
      transition: transform 0.18s ease;
    }
    .screen-card-wrap:hover {
      transform: translateY(-2px);
    }

    @keyframes radarPulse {
      0%, 100% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .radar-ring {
      animation: radarPulse 2.4s ease-in-out infinite;
    }

    @keyframes spinSlow {
      to { transform: rotate(360deg); }
    }
    .spin-slow {
      animation: spinSlow 1.4s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Ultra-Compact Sticky Top Header (~76px max height) -->
  <header id="studioHeader" class="sticky top-0 z-30 bg-[#FFFFFF]/95 backdrop-blur-md border-b border-[#E4E4DF]">
    <div class="max-w-[1480px] mx-auto pl-[48px] pr-3 sm:pr-5 pt-1 pb-1">
      <!-- Row 1: 40px Single-Line Toolbar -->
      <div class="h-[40px] flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-[22px] h-[22px] rounded-[6px] bg-[#F8F8F6] border border-[#E4E4DF] flex items-center justify-center shrink-0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M8 3V21M16 3V21M3 8H21M3 16H21" stroke="#CFCFC8" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M4.5 4.5L6.5 6.5M6.5 4.5L4.5 6.5" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
              <circle cx="12" cy="12" r="1.8" stroke="#141518" stroke-width="2"/>
              <path d="M17.5 17.5L19.5 19.5M19.5 17.5L17.5 19.5" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <h1 class="font-display text-[13.5px] sm:text-[15px] font-bold tracking-tight text-[#141518] truncate">
            Tic-Tac-Toe UI (53)
          </h1>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <!-- Segmented Toggle: Grid | 1:1 -->
          <div class="inline-flex p-0.5 rounded-[8px] bg-[#F1F1EE] border border-[#E4E4DF]">
            <button id="btnGridMode" type="button" onclick="setViewMode('grid')" class="px-2.5 py-0.5 rounded-[6px] text-[11px] font-semibold bg-[#FFFFFF] text-[#141518] shadow-2xs transition cursor-pointer">
              Grid
            </button>
            <button id="btnFocusMode" type="button" onclick="setViewMode('focus')" class="px-2.5 py-0.5 rounded-[6px] text-[11px] font-semibold text-[#5C606A] hover:text-[#141518] transition cursor-pointer">
              1:1
            </button>
          </div>

          <!-- Search Icon Button -->
          <button
            id="btnSearchToggle"
            type="button"
            onclick="toggleSearchBar()"
            title="Search screens"
            aria-label="Search screens"
            class="w-7 h-7 rounded-[8px] bg-[#F8F8F6] border border-[#E4E4DF] hover:border-[#1D4ED8] text-[#5C606A] hover:text-[#1D4ED8] flex items-center justify-center transition cursor-pointer"
          >
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
              <circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.6"/>
              <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>

          <!-- Hide Top Header Button -->
          <button
            type="button"
            onclick="toggleHeaderBar(true)"
            title="Hide header bar"
            class="h-7 px-2 rounded-[8px] bg-[#F8F8F6] border border-[#E4E4DF] hover:border-[#141518] text-[11px] font-semibold text-[#5C606A] hover:text-[#141518] flex items-center gap-1 transition cursor-pointer"
          >
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none">
              <path d="M3.5 10L8 5.5L12.5 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Hide</span>
          </button>
        </div>
      </div>

      <!-- Inline Search Bar (Hidden until Search Icon is clicked) -->
      <div id="searchDrawer" class="hidden py-1">
        <div class="relative w-full">
          <svg class="w-3.5 h-3.5 text-[#8E939E] absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="Search 53 screens, features, files..."
            oninput="handleSearch(this.value)"
            class="w-full h-8 pl-8 pr-8 rounded-[8px] bg-[#F8F8F6] border border-[#E4E4DF] text-[12px] text-[#141518] placeholder-[#8E939E] focus:outline-none focus:border-[#1D4ED8] focus:bg-[#FFFFFF] transition"
          />
          <button id="clearSearchBtn" type="button" onclick="clearSearch()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-[#8E939E] hover:text-[#141518] text-xs font-bold cursor-pointer">✕</button>
        </div>
      </div>

      <!-- Row 2: 32px Horizontally Scrollable Category Filter Pills -->
      <div id="categoryPills" class="h-[32px] flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
    </div>
  </header>

  <!-- Floating 'Show Bar' Pill in Top-Right Corner when Header is Hidden -->
  <button
    id="restoreHeaderBtn"
    type="button"
    onclick="toggleHeaderBar(false)"
    class="hidden fixed top-2.5 right-3 z-40 h-7 px-3 rounded-full bg-[#141518]/90 text-[#FFFFFF] text-[11px] font-semibold shadow-md backdrop-blur-xs items-center gap-1 cursor-pointer hover:bg-[#1D4ED8] transition"
  >
    <svg width="10" height="10" viewBox="0 0 16 16" fill="none">
      <path d="M3.5 6L8 10.5L12.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Show Bar</span>
  </button>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-[1480px] w-full mx-auto px-3 sm:px-6 pt-2.5 pb-6 sm:py-5">
    <!-- Grid Mode -->
    <section id="gridGalleryView">
      <div id="summaryBar" class="hidden sm:flex items-center justify-between mb-3">
        <p id="resultsSummary" class="text-[12px] text-[#5C606A] font-medium">
          Showing all 53 views • Click any frame to inspect 1:1
        </p>
        <span class="text-[11px] text-[#8E939E] hidden md:inline">
          Interactive: Multi-Grid Boards (#16, #27), Replay (#42), Spectate (#46), Shop (#48) &amp; Toggles
        </span>
      </div>

      <div id="screensGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-5 sm:gap-7 justify-items-center"></div>

      <div id="emptyState" class="hidden py-16 text-center">
        <h3 class="text-[15px] font-semibold text-[#141518]">No matching screens</h3>
        <p class="text-[13px] text-[#5C606A] mt-1">Clear your search or switch category tabs.</p>
        <button type="button" onclick="resetFilters()" class="mt-3 px-4 py-2 rounded-[10px] bg-[#1D4ED8] text-white text-[12.5px] font-semibold cursor-pointer">
          Reset Filters
        </button>
      </div>
    </section>

    <!-- 1:1 Focus Inspector Mode -->
    <section id="inlineFocusView" class="hidden">
      <div id="inlineFocusContent"></div>
    </section>
  </main>

  <!-- Modal Focus Inspector (triggered from Grid 'Inspect 1:1' or frame click) -->
  <div id="inspectorModal" class="fixed inset-0 z-40 hidden items-center justify-center p-2 sm:p-4 bg-[#141518]/45 backdrop-blur-[2px]" onclick="closeInspectorModal(event)">
    <div class="bg-[#FFFFFF] border border-[#E4E4DF] rounded-[20px] w-full max-w-[760px] max-h-[96vh] overflow-y-auto shadow-2xl p-2.5 sm:p-4 relative" onclick="event.stopPropagation()">
      <div id="modalFocusContent"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. VECTOR ICONS, SYMBOLS & PHONE SHELL HELPERS
    // =========================================================================
    const icons = {
      back: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8L10 12.5" stroke="#141518" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      chevron: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M6 3.5L10.5 8L6 12.5" stroke="#8E939E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      pause: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="4" y="3" width="2.8" height="10" rx="1" fill="#141518"/><rect x="9.2" y="3" width="2.8" height="10" rx="1" fill="#141518"/></svg>',

      checkGreen: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5L6.5 11.5L12.5 4.5" stroke="#15803D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      checkWhite: '<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5L6.5 11.5L12.5 4.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      copy: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 10.5H3C2.45 10.5 2 10.05 2 9.5V3C2 2.45 2.45 2 3 2H9.5C10.05 2 10.5 2.45 10.5 3V3.5" stroke="currentColor" stroke-width="1.5"/></svg>',
      share: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 2.5V10M8 2.5L5 5.5M8 2.5L11 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 10.5V12.5C3 13.05 3.45 13.5 4 13.5H12C12.55 13.5 13 13.05 13 12.5V10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',

      coin: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" fill="#FEF3C7" stroke="#B45309" stroke-width="1.4"/><text x="8" y="10.8" text-anchor="middle" font-size="7.5" font-weight="700" fill="#B45309">C</text></svg>',
      crown: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2.5 11.5L3.5 5L6.5 7.5L8 3.5L9.5 7.5L12.5 5L13.5 11.5H2.5Z" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1.2" stroke-linejoin="round"/></svg>',
      bot: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="4.5" width="11" height="8.5" rx="2.5" stroke="#1D4ED8" stroke-width="1.5"/><circle cx="6" cy="8.5" r="1" fill="#1D4ED8"/><circle cx="10" cy="8.5" r="1" fill="#1D4ED8"/><path d="M8 2V4.5" stroke="#1D4ED8" stroke-width="1.5" stroke-linecap="round"/></svg>',

      undo: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M4 6.5H10.5C12.16 6.5 13.5 7.84 13.5 9.5C13.5 11.16 12.16 12.5 10.5 12.5H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6.5 4L3.8 6.5L6.5 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      soundOn: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 6.2H5.5L8.8 3.5V12.5L5.5 9.8H3V6.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M11.2 5.6C12 6.3 12.4 7.1 12.4 8C12.4 8.9 12 9.7 11.2 10.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',

    function checkBoardWinner(c, gridSize) {
      const sz = gridSize || Math.round(Math.sqrt(c.length)) || 3;
      const winLen = sz === 3 ? 3 : 4;
      const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
      for (let r = 0; r < sz; r++) {
        for (let col = 0; col < sz; col++) {
          const start = r * sz + col;
          const sym = c[start];
          if (!sym) continue;
          for (let d = 0; d < dirs.length; d++) {
            const dr = dirs[d][0];
            const dc = dirs[d][1];
            const line = [start];
            for (let k = 1; k < winLen; k++) {
              const nr = r + dr * k;
              const nc = col + dc * k;
              if (nr < 0 || nr >= sz || nc < 0 || nc >= sz) break;
              const idx = nr * sz + nc;
              if (c[idx] !== sym) break;
              line.push(idx);
            }
            if (line.length === winLen) {
              return { winner: sym, line: line };
            }
          }
        }
      }
      if (c.every(function(cell) { return cell !== ''; })) {
        return { winner: 'Draw', line: null };
      }
      return null;
    }

    function pickBestAiCell(c, gridSize) {
      const sz = gridSize || Math.round(Math.sqrt(c.length)) || 3;
      const total = sz * sz;
      const empty = [];
      for (let i = 0; i < total; i++) {
        if (c[i] === '') empty.push(i);
      }
      if (empty.length === 0) return -1;
      for (let i = 0; i < empty.length; i++) {
        const copy = c.slice();
        copy[empty[i]] = 'O';
        if (checkBoardWinner(copy, sz)) return empty[i];
      }
      for (let i = 0; i < empty.length; i++) {
        const copy = c.slice();
        copy[empty[i]] = 'X';
        if (checkBoardWinner(copy, sz)) return empty[i];
      }
      if (sz === 3) {
        const pref = [4, 0, 2, 6, 8, 1, 3, 5, 7];
        for (let i = 0; i < pref.length; i++) {
          if (c[pref[i]] === '') return pref[i];
        }
      } else {
        const mid = Math.floor(total / 2);
        if (c[mid] === '') return mid;
      }
      return empty[0];
    }

        render: function() {

      }
    ];

    // =========================================================================
    // 4. FILTERING, RESPONSIVE SCALING, GRID & 1:1 FOCUS INSPECTOR
    // =========================================================================
    const CATEGORIES = [
      { key: 'All', label: 'All (53)' },
      { key: 'Onboarding', label: 'Onboarding (5)' },
      { key: 'Auth', label: 'Auth (4)' },
      { key: 'Home & Setup', label: 'Home & Setup (4)' },
      { key: 'Offline', label: 'Offline (6)' },
      { key: 'Online', label: 'Online (11)' },
      { key: 'Profile', label: 'Profile (2)' },
      { key: 'Progression', label: 'Progression (4)' },
      { key: 'Social', label: 'Social (4)' },
      { key: 'Settings', label: 'Settings (4)' },
      { key: 'Popups & Overlays', label: 'Popups (9)' }
    ];

    let activeCategory = 'All';
    let searchQuery = '';
    let viewMode = 'grid';
    let focusedIndex = 0;
    let modalOpen = false;
    let searchBarOpen = false;
    let inspectorInfoOpen = false;

    function getDeviceScale(isFocus) {
      const vw = window.innerWidth || 375;
      const vh = window.innerHeight || 720;
      const maxW = vw - 24;
      let scaleW = maxW < 336 ? maxW / 336 : 1;
      if (!isFocus) {
        return Math.max(0.76, Math.min(1, scaleW));
      }
      // In 1:1 Focus Inspector, also fit vertically inside mobile viewport without scrolling
      const headerH = document.getElementById('studioHeader').classList.contains('hidden') ? 8 : 78;
      const availH = vh - headerH - 64;
      const scaleH = availH < 656 ? availH / 656 : 1;
      return Math.max(0.68, Math.min(1, scaleW, scaleH));
    }

    function toggleSearchBar() {
      searchBarOpen = !searchBarOpen;
      const drawer = document.getElementById('searchDrawer');
      const btn = document.getElementById('btnSearchToggle');
      drawer.classList.toggle('hidden', !searchBarOpen);
      if (searchBarOpen) {
        btn.classList.add('border-[#1D4ED8]', 'text-[#1D4ED8]', 'bg-[#EFF4FF]');
        setTimeout(function() { document.getElementById('searchInput').focus(); }, 30);
      } else {
        btn.classList.remove('border-[#1D4ED8]', 'text-[#1D4ED8]', 'bg-[#EFF4FF]');
        if (searchQuery) clearSearch();
      }
    }

    function toggleHeaderBar(hide) {
      const header = document.getElementById('studioHeader');
      const restoreBtn = document.getElementById('restoreHeaderBtn');
      header.classList.toggle('hidden', hide);
      if (hide) {
        restoreBtn.classList.remove('hidden');
        restoreBtn.classList.add('flex');
      } else {
        restoreBtn.classList.add('hidden');
        restoreBtn.classList.remove('flex');
      }
      if (viewMode === 'focus') renderFocusViews();
    }

    function toggleInspectorInfo() {
      inspectorInfoOpen = !inspectorInfoOpen;
      renderFocusViews();
    }

    function getFilteredScreens() {
      return SCREENS.filter(function(s) {
        const matchesCat = activeCategory === 'All' || s.category === activeCategory;
        if (!matchesCat) return false;
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase();
        return (
          s.name.toLowerCase().indexOf(q) !== -1 ||
          s.file.toLowerCase().indexOf(q) !== -1 ||
          s.category.toLowerCase().indexOf(q) !== -1 ||
          s.notes.toLowerCase().indexOf(q) !== -1 ||
          String(s.id).indexOf(q) !== -1
        );
      });
    }

    function renderCategoryPills() {
      const container = document.getElementById('categoryPills');
      container.innerHTML = CATEGORIES.map(function(cat) {
        const isActive = activeCategory === cat.key;
        const cls = isActive
          ? 'bg-[#1D4ED8] text-[#FFFFFF]'
          : 'bg-[#F8F8F6] text-[#5C606A] border border-[#E4E4DF] hover:text-[#141518] hover:bg-[#FFFFFF]';
        return '<button type="button" onclick="selectCategory(\'' + cat.key + '\')" class="px-2.5 py-1 rounded-[8px] text-[11px] font-semibold whitespace-nowrap transition cursor-pointer ' + cls + '">' + cat.label + '</button>';
      }).join('');
    }

    function renderGridGallery() {
      const filtered = getFilteredScreens();
      const grid = document.getElementById('screensGrid');
      const empty = document.getElementById('emptyState');
      const summary = document.getElementById('resultsSummary');
      const summaryBar = document.getElementById('summaryBar');

      const isFiltered = filtered.length !== SCREENS.length;
      summary.textContent = isFiltered
        ? 'Showing ' + filtered.length + ' of 53 views • Click any frame to inspect 1:1'
        : 'Showing all 53 views • Click any frame to inspect 1:1';

      if (isFiltered) {
        summaryBar.classList.remove('hidden');
        summaryBar.classList.add('flex');
      } else {
        summaryBar.className = 'hidden sm:flex items-center justify-between mb-3';
      }

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      const scale = getDeviceScale(false);
      const scaledW = Math.round(336 * scale);
      const scaledH = Math.round(656 * scale);
      const scaleStyle = scale < 1 ? 'transform:scale(' + scale.toFixed(3) + ');' : '';

      grid.innerHTML = filtered.map(function(screen) {
        const globalIdx = SCREENS.findIndex(function(item) { return item.id === screen.id; });
        const padId = String(screen.id).padStart(2, '0');
        return `
          <article class="screen-card-wrap flex flex-col items-center">
            <div style="width:${scaledW}px" class="flex items-center justify-between mb-1.5 px-0.5">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="px-1.5 py-0.5 rounded-[6px] bg-[#FFFFFF] border border-[#E4E4DF] mono text-[10px] font-semibold text-[#5C606A] tabular shrink-0">
                  #${padId}
                </span>
                <h2 class="text-[12.5px] font-bold text-[#141518] truncate" title="${screen.name}">
                  ${screen.name}
                </h2>
              </div>
              <button
                type="button"
                onclick="openInspectorModal(${globalIdx})"
                class="px-2 py-0.5 rounded-[7px] bg-[#FFFFFF] border border-[#E4E4DF] hover:border-[#1D4ED8] hover:text-[#1D4ED8] text-[10.5px] font-semibold text-[#5C606A] transition cursor-pointer shrink-0"
              >
                Inspect 1:1
              </button>
            </div>

            <div style="width:${scaledW}px;height:${scaledH}px" class="flex justify-center overflow-visible">
              <div class="device-shell cursor-pointer" style="${scaleStyle}" onclick="handleFrameClick(event, ${globalIdx})">
                <div class="device-screen">
                  ${screen.render()}
                </div>
              </div>
            </div>

            <div style="width:${scaledW}px" class="mt-1.5 px-0.5 flex items-center justify-between gap-2">
              <span class="mono text-[10px] text-[#8E939E] truncate" title="${screen.file}">
                ${screen.file}
              </span>
              <span class="text-[10px] font-medium text-[#5C606A] shrink-0">
                ${screen.category}
              </span>
            </div>
          </article>
        `;
      }).join('');
    }

    function handleFrameClick(event, idx) {
      const clickable = event.target.closest('button, [onclick]');
      if (clickable && !clickable.classList.contains('device-shell')) {
        return;
      }
      openInspectorModal(idx);
    }

    function buildFocusInspectorHTML(idx, isModal) {
      const screen = SCREENS[idx];
      const prevIdx = (idx - 1 + SCREENS.length) % SCREENS.length;
      const nextIdx = (idx + 1) % SCREENS.length;
      const scale = getDeviceScale(true);
      const scaledW = Math.round(336 * scale);
      const scaledH = Math.round(656 * scale);
      const scaleStyle = scale < 1 ? 'transform:scale(' + scale.toFixed(3) + ');' : '';

      return `
        <div class="flex flex-col items-center w-full max-w-[740px] mx-auto">
          <!-- Compact 42px Top Navigation Bar -->
          <div class="w-full h-[42px] flex items-center justify-between gap-1.5 mb-2 bg-[#FFFFFF] border border-[#E4E4DF] rounded-[11px] px-1.5 shadow-2xs">
            <div class="flex items-center gap-1 min-w-0">
              <button
                type="button"
                onclick="navigateInspector(${prevIdx})"
                class="h-7 px-2 rounded-[7px] bg-[#F8F8F6] border border-[#E4E4DF] hover:border-[#141518] text-[11px] font-semibold text-[#141518] cursor-pointer shrink-0"
              >
                ← Prev
              </button>

              <select
                onchange="navigateInspector(Number(this.value))"
                aria-label="Select screen"
                class="h-7 px-1.5 rounded-[7px] bg-[#F8F8F6] border border-[#E4E4DF] text-[11px] font-semibold text-[#141518] max-w-[138px] sm:max-w-[230px] truncate focus:outline-none focus:border-[#1D4ED8] cursor-pointer"
              >
                ${SCREENS.map(function(s, i) {
                  return '<option value="' + i + '" ' + (i === idx ? 'selected' : '') + '>#' + String(s.id).padStart(2, '0') + ' ' + s.name + '</option>';
                }).join('')}
              </select>

              <button
                type="button"
                onclick="navigateInspector(${nextIdx})"
                class="h-7 px-2 rounded-[7px] bg-[#1D4ED8] hover:bg-[#1E40AF] text-[11px] font-semibold text-[#FFFFFF] cursor-pointer shrink-0"
              >
                Next →
              </button>
            </div>

            <div class="flex items-center gap-1 shrink-0">
              <button
                type="button"
                onclick="toggleInspectorInfo()"
                class="h-7 px-2 rounded-[7px] border text-[11px] font-semibold cursor-pointer transition ${
                  inspectorInfoOpen
                    ? 'bg-[#EFF4FF] border-[#1D4ED8] text-[#1D4ED8]'
                    : 'bg-[#F8F8F6] border-[#E4E4DF] text-[#5C606A] hover:text-[#141518]'
                }"
              >
                Info
              </button>

              ${isModal ? `
                <button
                  type="button"
                  onclick="closeInspectorModal()"
                  class="w-7 h-7 rounded-[7px] bg-[#F8F8F6] border border-[#E4E4DF] hover:bg-[#EFEFED] flex items-center justify-center text-[#141518] text-xs font-bold cursor-pointer"
                  title="Close"
                >
                  ✕
                </button>
              ` : `
                <button
                  type="button"
                  onclick="setViewMode('grid')"
                  class="h-7 px-2 rounded-[7px] bg-[#F8F8F6] border border-[#E4E4DF] hover:border-[#141518] text-[11px] font-semibold text-[#141518] cursor-pointer"
                >
                  Grid
                </button>
              `}
            </div>
          </div>

          <!-- Toggleable File Path & Design Note Drawer -->
          <div class="${inspectorInfoOpen ? 'block' : 'hidden'} w-full mb-2 bg-[#FFFFFF] border border-[#E4E4DF] rounded-[12px] p-3 shadow-xs space-y-1.5 text-left">
            <div class="flex items-center justify-between gap-2">
              <code class="mono text-[10.5px] text-[#1D4ED8] font-semibold truncate">${screen.file}</code>
              <span class="px-2 py-0.5 rounded bg-[#F1F1EE] text-[10px] font-semibold text-[#5C606A] shrink-0">${screen.category}</span>
            </div>
            <p class="text-[11.5px] leading-[17px] text-[#5C606A]">${screen.notes}</p>
          </div>

          <!-- Centered 320x640 Phone Frame -->
          <div style="width:${scaledW}px;height:${scaledH}px" class="flex justify-center overflow-visible">
            <div class="device-shell" style="${scaleStyle}">
              <div class="device-screen">
                ${screen.render()}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderFocusViews() {
      document.getElementById('inlineFocusContent').innerHTML = buildFocusInspectorHTML(focusedIndex, false);
      if (modalOpen) {
        document.getElementById('modalFocusContent').innerHTML = buildFocusInspectorHTML(focusedIndex, true);
      }
    }

    function refreshRenderedViews() {
      renderGridGallery();
      if (viewMode === 'focus' || modalOpen) {
        renderFocusViews();
      }
    }

    function selectCategory(cat) {
      activeCategory = cat;
      renderCategoryPills();
      renderGridGallery();
      if (viewMode === 'focus') {
        const filtered = getFilteredScreens();
        if (filtered.length > 0) {
          focusedIndex = SCREENS.findIndex(function(s) { return s.id === filtered[0].id; });
          renderFocusViews();
        }
      }
    }

    function handleSearch(val) {
      searchQuery = val;
      document.getElementById('clearSearchBtn').classList.toggle('hidden', !val);
      renderGridGallery();
    }

    function clearSearch() {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderGridGallery();
    }

    function resetFilters() {
      activeCategory = 'All';
      clearSearch();
      renderCategoryPills();
      renderGridGallery();
    }

    function setViewMode(mode) {
      viewMode = mode;
      const btnGrid = document.getElementById('btnGridMode');
      const btnFocus = document.getElementById('btnFocusMode');
      const gridSec = document.getElementById('gridGalleryView');
      const focusSec = document.getElementById('inlineFocusView');

      if (mode === 'grid') {
        btnGrid.className = 'px-2.5 py-0.5 rounded-[6px] text-[11px] font-semibold bg-[#FFFFFF] text-[#141518] shadow-2xs transition cursor-pointer';
        btnFocus.className = 'px-2.5 py-0.5 rounded-[6px] text-[11px] font-semibold text-[#5C606A] hover:text-[#141518] transition cursor-pointer';
        gridSec.classList.remove('hidden');
        focusSec.classList.add('hidden');
      } else {
        btnFocus.className = 'px-2.5 py-0.5 rounded-[6px] text-[11px] font-semibold bg-[#FFFFFF] text-[#141518] shadow-2xs transition cursor-pointer';
        btnGrid.className = 'px-2.5 py-0.5 rounded-[6px] text-[11px] font-semibold text-[#5C606A] hover:text-[#141518] transition cursor-pointer';
        gridSec.classList.add('hidden');
        focusSec.classList.remove('hidden');
        renderFocusViews();
      }
    }

    function openInspectorModal(idx) {
      focusedIndex = idx;
      modalOpen = true;
      const modal = document.getElementById('inspectorModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      renderFocusViews();
    }

    function closeInspectorModal(e) {
      if (e && e.target !== document.getElementById('inspectorModal')) return;
      modalOpen = false;
      const modal = document.getElementById('inspectorModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function navigateInspector(idx) {
      focusedIndex = idx;
      renderFocusViews();
    }

    document.addEventListener('keydown', function(e) {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'Escape' && modalOpen) {
        closeInspectorModal();
      } else if ((modalOpen || viewMode === 'focus') && e.key === 'ArrowRight') {
        navigateInspector((focusedIndex + 1) % SCREENS.length);
      } else if ((modalOpen || viewMode === 'focus') && e.key === 'ArrowLeft') {
        navigateInspector((focusedIndex - 1 + SCREENS.length) % SCREENS.length);
      }
    });

    window.addEventListener('resize', function() {
      refreshRenderedViews();
    });

    function initApp() {
      renderCategoryPills();
      renderGridGallery();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
